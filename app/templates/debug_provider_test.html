{% extends "base.html" %}
{% block content %}
<div class="card mb-3">
  <div class="card-header">Provider Smoke Test Result</div>
  <div class="card-body">
    <dl class="row mb-0">
      <dt class="col-sm-3">Provider</dt>
      <dd class="col-sm-9"><code>{{ result.provider }}</code></dd>
      <dt class="col-sm-3">Model</dt>
      <dd class="col-sm-9"><code>{{ result.model }}</code></dd>
      <dt class="col-sm-3">HTTP status</dt>
      <dd class="col-sm-9"><code>{{ result.status_code }}</code></dd>
      <dt class="col-sm-3">Parsed text</dt>
      <dd class="col-sm-9"><pre class="mb-0">{{ result.parsed_text or '(empty)' }}</pre></dd>
    </dl>
  </div>
</div>
<div class="card mb-3">
  <div class="card-header">Raw response body</div>
  <div class="card-body">
    <pre class="mb-0">{{ raw_body }}</pre>
  </div>
</div>
<div class="d-flex gap-2">
  <a href="/debug/provider-test" class="btn btn-outline-primary">Run again</a>
  <a href="/debug/providers" class="btn btn-outline-secondary">Diagnostics</a>
</div>
{% endblock %}
