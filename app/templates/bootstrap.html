<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Console Setup</title><link rel="stylesheet" href="/static/css/mission_control.css"></head><body class="mc-body layout-minimal"><main class="mc-page" style="max-width:560px;margin:6vh auto;"><div class="card"><div class="card-header">First administrator</div><div class="card-body"><h1>Set up Campaign Console</h1><p>Create the first local application administrator. Existing campaigns will be assigned to this account as owner.</p>{% if message %}<p class="alert alert-warning">{{ message }}</p>{% endif %}<form method="post" action="/bootstrap"><label class="form-label">Username</label><input class="form-control" name="username" required><label class="form-label">Display name</label><input class="form-control" name="display_name" required><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required><button class="mc-btn mc-btn-primary" type="submit">Create administrator</button></form></div></div></main></body></html>
