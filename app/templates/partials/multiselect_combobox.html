<div class="mc-multiselect" data-mc-multiselect data-field-name="{{ select.name }}">
  <div class="mc-multiselect-control border rounded">
    <div class="mc-multiselect-tags" aria-live="polite">
      {% for option in select.options if option.selected %}
      <span class="mc-multiselect-tag" data-value="{{ option.value }}">
        <span class="mc-multiselect-tag-label">{{ option.label }}</span>
        <button type="button" class="mc-multiselect-tag-remove" aria-label="Remove {{ option.label }}">&times;</button>
      </span>
      {% endfor %}
    </div>
    <input
      type="text"
      class="mc-multiselect-search form-control border-0 shadow-none"
      placeholder="Type to search and add…"
      autocomplete="off"
      aria-label="{{ select.label }} search"
    />
  </div>
  <div class="mc-multiselect-dropdown border rounded" hidden>
    {% for option in select.options %}
    <button
      type="button"
      class="mc-multiselect-option{% if option.selected %} is-selected{% endif %}"
      data-value="{{ option.value }}"
      data-label="{{ option.label }}"
      {% if option.selected %}hidden{% endif %}
    >
      {{ option.label }}
    </button>
    {% endfor %}
  </div>
  <div class="mc-multiselect-values">
    {% for option in select.options if option.selected %}
    <input type="hidden" name="{{ select.name }}" value="{{ option.value }}" />
    {% endfor %}
  </div>
</div>
