{% extends "base.html" %}{% block title %}Change Password{% endblock %}{% block content %}<div class="card"><div class="card-header">Account</div><div class="card-body"><h1>Change password</h1>{% if message %}<p class="alert alert-warning">{{ message }}</p>{% endif %}<form method="post" action="/account/password"><label class="form-label">Current password</label><input class="form-control" type="password" name="current_password" required><label class="form-label">New password</label><input class="form-control" type="password" name="new_password" minlength="8" required><button class="mc-btn mc-btn-primary" type="submit">Change password</button></form></div></div>{% endblock %}
