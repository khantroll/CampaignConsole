<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign Console Login</title><link rel="stylesheet" href="/static/css/mission_control.css"></head><body class="mc-body layout-minimal"><main class="mc-page" style="max-width:520px;margin:8vh auto;"><div class="card"><div class="card-header">Campaign Console</div><div class="card-body"><h1>Sign in</h1>{% if message %}<p class="alert alert-warning">{{ message }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="next" value="{{ next_url }}"><label class="form-label">Username</label><input class="form-control" name="username" autocomplete="username" required><label class="form-label">Password</label><input class="form-control" type="password" name="password" autocomplete="current-password" required><button class="mc-btn mc-btn-primary" type="submit">Sign in</button></form></div></div></main></body></html>
