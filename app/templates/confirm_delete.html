{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-header">
    {{ title }}
  </div>
  <div class="card-body">
    <p>{{ message }}</p>
    <form action="{{ action }}" method="post">
      <button type="submit" class="btn btn-danger">Confirm Delete</button>
      <a href="{{ cancel_url }}" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
