{% extends "base.html" %}
{% block content %}
<div class="card mb-3">
  <div class="card-header">Provider Smoke Test</div>
  <div class="card-body">
    <p class="text-muted">Sends one request to the active provider with no retries or fallbacks.</p>
    <dl class="row mb-3">
      <dt class="col-sm-3">Provider</dt>
      <dd class="col-sm-9"><code>{{ provider }}</code></dd>
      <dt class="col-sm-3">Model</dt>
      <dd class="col-sm-9"><code>{{ model_info.model if model_info else 'unknown' }}</code></dd>
      <dt class="col-sm-3">Prompt</dt>
      <dd class="col-sm-9"><code>{{ prompt }}</code></dd>
    </dl>
    <form action="/debug/provider-test" method="post">
      <button type="submit" class="btn btn-primary">Run smoke test</button>
    </form>
  </div>
</div>
<div class="d-flex gap-2">
  <a href="/debug/providers" class="btn btn-outline-secondary">Back to diagnostics</a>
</div>
{% endblock %}
